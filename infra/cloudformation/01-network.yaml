AWSTemplateFormatVersion: "2010-09-09"
Description: Job Application Portal - VPC, subnets, routing and security groups (no NAT gateway)

Parameters:
  ProjectName: { Type: String, Default: JobApplicationPortal }
  VpcCidr: { Type: String, Default: 10.0.0.0/16 }
  PublicSubnet1Cidr: { Type: String, Default: 10.0.1.0/24 }
  PublicSubnet2Cidr: { Type: String, Default: 10.0.2.0/24 }
  PrivateSubnet1Cidr: { Type: String, Default: 10.0.11.0/24 }
  PrivateSubnet2Cidr: { Type: String, Default: 10.0.12.0/24 }
  AdminCidr:
    Type: String
    Description: Your public IP or small ISP range (/20-/32) - allowed to reach the app servers directly on port 80 (remove later)
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/(2[0-9]|3[0-2])$'

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: jobportal-vpc }]
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties: { Tags: [{ Key: Name, Value: jobportal-igw }] }
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: jobportal-public-1 }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: jobportal-public-2 }]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: jobportal-private-1 }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: jobportal-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: jobportal-public-rt }] }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: jobportal-private-rt }] }
  Pub1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  Pub2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }
  Priv1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }
  Priv2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB - HTTP from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{ IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }]
      Tags: [{ Key: Name, Value: jobportal-alb-sg }]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App servers - port 80 from ALB and from admin IP only; no SSH (use SSM)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: From ALB }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AdminCidr, Description: Admin direct access (temporary) }
      Tags: [{ Key: Name, Value: jobportal-app-sg }]
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - only from app servers
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{ IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: From app SG }]
      Tags: [{ Key: Name, Value: jobportal-db-sg }]

Outputs:
  VpcId: { Value: !Ref Vpc, Export: { Name: !Sub "${AWS::StackName}-VpcId" } }
  PublicSubnet1: { Value: !Ref PublicSubnet1 }
  PublicSubnet2: { Value: !Ref PublicSubnet2 }
  PrivateSubnet1: { Value: !Ref PrivateSubnet1 }
  PrivateSubnet2: { Value: !Ref PrivateSubnet2 }
  AlbSecurityGroup: { Value: !Ref AlbSecurityGroup }
  AppSecurityGroup: { Value: !Ref AppSecurityGroup }
  DbSecurityGroup: { Value: !Ref DbSecurityGroup }
